<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Générateur de Palette sur mesure</title>
    <style>
        :root {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #0f172a; /* Fond sombre style Tailwind */
            color: #f8fafc;
        }

        body {
            max-width: 1000px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 40px;
            font-weight: 600;
        }

        /* Panneau de contrôle */
        .controls {
            background-color: #1e293b;
            padding: 24px;
            border-radius: 12px;
            display: flex;
            flex-wrap: wrap;
            gap: 24px;
            margin-bottom: 40px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .control-group {
            flex: 1;
            min-width: 200px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 14px;
            font-weight: 500;
            color: #cbd5e1;
            display: flex;
            justify-content: space-between;
        }

        input[type="color"] {
            width: 100%;
            height: 40px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: none;
        }

        input[type="range"] {
            width: 100%;
            cursor: pointer;
        }

        /* Affichage de la palette */
        .palette-container {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .palette-row {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .palette-label {
            width: 80px;
            font-size: 18px;
            font-weight: 600;
            text-transform: capitalize;
        }

        .swatches {
            display: flex;
            gap: 16px;
            flex: 1;
            flex-wrap: wrap;
        }

        .swatch {
            flex: 1;
            min-width: 60px;
            aspect-ratio: 1;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
        }

        .swatch:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }

        .swatch-name {
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 4px;
        }

        .swatch-hex {
            font-size: 12px;
            opacity: 0.8;
            text-transform: uppercase;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #10b981;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 500;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
        }

        /* Boutons d'export */
        .actions-group {
            min-width: 280px;
            justify-content: flex-end;
        }

        .btn-group {
            display: flex;
            gap: 12px;
            width: 100%;
        }

        .btn {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s, box-shadow 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex: 1;
        }

        .btn:hover {
            background-color: #2563eb;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-secondary {
            background-color: #334155;
            color: #f8fafc;
        }

        .btn-secondary:hover {
            background-color: #475569;
            box-shadow: 0 4px 12px rgba(71, 85, 105, 0.3);
        }

        .icon {
            display: inline-block;
            flex-shrink: 0;
        }
    </style>
</head>
<body>

    <h1>Générateur de Palette HSL</h1>

    <div class="controls">
        <div class="control-group">
            <label for="baseColor">Couleur de base (500)</label>
            <input type="color" id="baseColor" value="#3b82f6">
        </div>
        <div class="control-group">
            <label for="hueAdj">
                Ajustement Teinte (Hue) <span id="hueVal">0°</span>
            </label>
            <input type="range" id="hueAdj" min="-50" max="50" value="0">
        </div>
        <div class="control-group">
            <label for="satAdj">
                Ajustement Saturation <span id="satVal">0%</span>
            </label>
            <input type="range" id="satAdj" min="-50" max="50" value="0">
        </div>
        <div class="control-group actions-group">
            <label>Export Palette</label>
            <div class="btn-group">
                <button type="button" id="copySvgBtn" class="btn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                    Copier SVG (Figma)
                </button>
                <button type="button" id="downloadSvgBtn" class="btn btn-secondary">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                    Télécharger SVG
                </button>
            </div>
        </div>
    </div>

    <div class="palette-container">
        <div class="palette-row">
            <div class="palette-label" id="colorName">Custom</div>
            <div class="swatches" id="swatchContainer">
                </div>
        </div>
    </div>

    <div class="toast" id="toast">Copié dans le presse-papier !</div>

    <script>
        // DOM Elements
        const baseColorInput = document.getElementById('baseColor');
        const hueAdjInput = document.getElementById('hueAdj');
        const satAdjInput = document.getElementById('satAdj');
        const hueValDisplay = document.getElementById('hueVal');
        const satValDisplay = document.getElementById('satVal');
        const swatchContainer = document.getElementById('swatchContainer');
        const toast = document.getElementById('toast');
        const copySvgBtn = document.getElementById('copySvgBtn');
        const downloadSvgBtn = document.getElementById('downloadSvgBtn');

        // L'échelle classique de luminosité (Lightness)
        const scaleSteps = [
            { name: '50', l: 95 },
            { name: '100', l: 90 },
            { name: '200', l: 80 },
            { name: '300', l: 70 },
            { name: '400', l: 60 },
            { name: '500', l: 50 }, // Point de référence
            { name: '600', l: 40 },
            { name: '700', l: 30 },
            { name: '800', l: 20 },
            { name: '900', l: 12 },
            { name: '950', l: 6 }
        ];

        // Convertisseur Hex vers HSL
        function hexToHSL(hex) {
            let r = 0, g = 0, b = 0;
            if (hex.length == 4) {
                r = "0x" + hex[1] + hex[1]; g = "0x" + hex[2] + hex[2]; b = "0x" + hex[3] + hex[3];
            } else if (hex.length == 7) {
                r = "0x" + hex[1] + hex[2]; g = "0x" + hex[3] + hex[4]; b = "0x" + hex[5] + hex[6];
            }
            r /= 255; g /= 255; b /= 255;
            let cmin = Math.min(r,g,b), cmax = Math.max(r,g,b), delta = cmax - cmin, h = 0, s = 0, l = 0;

            if (delta == 0) h = 0;
            else if (cmax == r) h = ((g - b) / delta) % 6;
            else if (cmax == g) h = (b - r) / delta + 2;
            else h = (r - g) / delta + 4;

            h = Math.round(h * 60);
            if (h < 0) h += 360;
            l = (cmax + cmin) / 2;
            s = delta == 0 ? 0 : delta / (1 - Math.abs(2 * l - 1));
            
            return { h, s: +(s * 100).toFixed(1), l: +(l * 100).toFixed(1) };
        }

        // Convertisseur HSL vers Hex
        function hslToHex(h, s, l) {
            s /= 100; l /= 100;
            let c = (1 - Math.abs(2 * l - 1)) * s,
                x = c * (1 - Math.abs((h / 60) % 2 - 1)),
                m = l - c/2, r = 0, g = 0, b = 0;

            if (0 <= h && h < 60) { r = c; g = x; b = 0; }
            else if (60 <= h && h < 120) { r = x; g = c; b = 0; }
            else if (120 <= h && h < 180) { r = 0; g = c; b = x; }
            else if (180 <= h && h < 240) { r = 0; g = x; b = c; }
            else if (240 <= h && h < 300) { r = x; g = 0; b = c; }
            else if (300 <= h && h < 360) { r = c; g = 0; b = x; }

            r = Math.round((r + m) * 255).toString(16).padStart(2, '0');
            g = Math.round((g + m) * 255).toString(16).padStart(2, '0');
            b = Math.round((b + m) * 255).toString(16).padStart(2, '0');

            return `#${r}${g}${b}`;
        }

        // Fonction pour afficher le toast
        function showToast(message) {
            toast.innerText = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        // Fonction pour copier dans le presse-papier
        function copyToClipboard(text, message = 'Copié dans le presse-papier !') {
            navigator.clipboard.writeText(text).then(() => {
                showToast(message);
            });
        }

        // Fonction pour générer le code SVG de la palette
        function generateSVG() {
            const rectWidth = 100;
            const rectHeight = 100;
            const gap = 16;
            const totalWidth = (rectWidth * scaleSteps.length) + (gap * (scaleSteps.length - 1));
            const totalHeight = 100;

            let svgContent = `<svg width="${totalWidth}" height="${totalHeight}" viewBox="0 0 ${totalWidth} ${totalHeight}" fill="none" xmlns="http://www.w3.org/2000/svg">\n`;

            const baseHex = baseColorInput.value;
            let baseHSL = hexToHSL(baseHex);
            const hueAdj = parseInt(hueAdjInput.value);
            const satAdj = parseInt(satAdjInput.value);

            scaleSteps.forEach((step, index) => {
                const x = index * (rectWidth + gap);
                
                let h = (baseHSL.h + hueAdj) % 360;
                if (h < 0) h += 360;
                let s = Math.max(0, Math.min(100, baseHSL.s + satAdj));
                let l = step.l;

                const hexColor = hslToHex(h, s, l);
                const textColor = l < 55 ? '#ffffff' : '#0f172a';

                svgContent += `  <g id="Swatch-${step.name}" transform="translate(${x}, 0)">\n`;
                svgContent += `    <rect width="${rectWidth}" height="${rectHeight}" rx="12" fill="${hexColor}" />\n`;
                svgContent += `    <text x="50" y="45" fill="${textColor}" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" text-anchor="middle">${step.name}</text>\n`;
                svgContent += `    <text x="50" y="65" fill="${textColor}" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" opacity="0.8" text-anchor="middle">${hexColor.toUpperCase()}</text>\n`;
                svgContent += `  </g>\n`;
            });

            svgContent += `</svg>`;
            return svgContent;
        }

        // Fonction pour télécharger l'SVG
        function downloadSVG() {
            const svgContent = generateSVG();
            const blob = new Blob([svgContent], { type: 'image/svg+xml' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            const baseHex = baseColorInput.value.substring(1);
            a.href = url;
            a.download = `palette-${baseHex}.svg`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast('Fichier SVG téléchargé !');
        }

        // Écouteurs pour l'export SVG
        copySvgBtn.addEventListener('click', () => {
            const svgContent = generateSVG();
            copyToClipboard(svgContent, 'Palette SVG copiée pour Figma !');
        });

        downloadSvgBtn.addEventListener('click', downloadSVG);

        // Fonction principale de génération
        function generatePalette() {
            swatchContainer.innerHTML = ''; // Nettoyer
            
            const baseHex = baseColorInput.value;
            let baseHSL = hexToHSL(baseHex);
            
            const hueAdj = parseInt(hueAdjInput.value);
            const satAdj = parseInt(satAdjInput.value);

            // Mettre à jour les labels
            hueValDisplay.innerText = hueAdj > 0 ? `+${hueAdj}°` : `${hueAdj}°`;
            satValDisplay.innerText = satAdj > 0 ? `+${satAdj}%` : `${satAdj}%`;

            scaleSteps.forEach(step => {
                // Appliquer les ajustements
                let h = (baseHSL.h + hueAdj) % 360;
                if (h < 0) h += 360; // Gérer les valeurs négatives
                
                let s = Math.max(0, Math.min(100, baseHSL.s + satAdj));
                let l = step.l; // Utiliser la luminosité de l'échelle

                // Obtenir le code Hex final
                const hexColor = hslToHex(h, s, l);
                
                // Déterminer la couleur du texte (blanc ou noir selon la luminosité)
                const textColor = l < 55 ? '#ffffff' : '#0f172a';

                // Créer l'élément HTML (la case de couleur)
                const swatch = document.createElement('div');
                swatch.className = 'swatch';
                swatch.style.backgroundColor = hexColor;
                swatch.style.color = textColor;
                swatch.onclick = () => copyToClipboard(hexColor);
                
                swatch.innerHTML = `
                    <div class="swatch-name">${step.name}</div>
                    <div class="swatch-hex">${hexColor}</div>
                `;

                swatchContainer.appendChild(swatch);
            });
        }

        // Écouteurs d'événements
        baseColorInput.addEventListener('input', generatePalette);
        hueAdjInput.addEventListener('input', generatePalette);
        satAdjInput.addEventListener('input', generatePalette);

        // Initialisation au chargement
        generatePalette();
    </script>
</body>
</html>
